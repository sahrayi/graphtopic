[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "graphtopic"
version = "0.0.1"

description = "Graph-based topic modeling using semantic graphs"

keywords = [
    "topic-modeling",
    "graph",
    "nlp",
    "embeddings",
    "community-detection",
]

readme = "README.md"

requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "Mohsen Sahrayi" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]


dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "graphion>=0.0.1",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]


embedding = [

]


[tool.setuptools]

package-dir = {"" = "src"}


[tool.setuptools.packages.find]

where = [
    "src"
]


[tool.pytest.ini_options]

pythonpath = [
    "src"
]

testpaths = [
    "tests"
]

addopts = [
    "-v"
]

[project.urls]

Homepage = "https://github.com/sahrayi/graphtopic"
Repository = "https://github.com/sahrayi/graphtopic"
Issues = "https://github.com/sahrayi/graphtopic/issues"
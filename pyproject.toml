[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtopic"
version = "0.1.1"
description = "Topic discovery through sparse semantic graphs and Leiden communities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohsen Sahrayi"}]
keywords = ["topic-modeling", "nlp", "graph", "leiden", "embeddings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11.1",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "pynndescent>=0.5.13",
  "igraph>=0.11.2",
  "leidenalg>=0.10.2",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "build>=1.2", "twine>=6"]
experiments = [
  "psutil>=5.9",
  "bertopic>=0.17",
  "sentence-transformers>=3",
  "huggingface-hub>=1.0",
  "pyarrow>=22",
]

[project.urls]
Homepage = "https://github.com/sahrayi/graphtopic"
Repository = "https://github.com/sahrayi/graphtopic"
Issues = "https://github.com/sahrayi/graphtopic/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphtopic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: exercises real NNDescent or Leiden backends",
  "optional_embedding: downloads and exercises a real Sentence Transformers model",
]

[tool.coverage.run]
source = ["graphtopic"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
